<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#171310">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SHALA PARTY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171310'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23ffc93d'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23171310'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171310; --bg2:#211b15; --surf:#26201725; --card:#251f17; --card2:#2c251b;
  --line:#3b3227; --line2:#4a3e2f;
  --ink:#f7efdd; --ink2:#b6a68d; --dim:#8a7b64;
  --yl:#ffc93d; --yl2:#ffd76a; --red:#ff5d5d; --tl:#38d3c0; --gr:#4ecb71; --or:#ff8f3d; --pk:#e86fa4;
  --shadow:5px 5px 0 rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Baloo Bhaijaan 2',sans-serif;color:var(--ink);
  background:#0d0b09;
  background-image:radial-gradient(rgba(255,201,61,.05) 1.2px,transparent 1.2px);
  background-size:26px 26px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
#frame{
  position:relative;width:min(430px,100vw);height:min(900px,100dvh);
  background:var(--bg);overflow:hidden;display:flex;flex-direction:column;
}
@media(min-width:480px){
  #frame{border:2px solid #33291c;border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.7);height:min(860px,94dvh)}
}
#frame::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:22px 22px;
}
#stage{position:absolute;inset:0;overflow:hidden;z-index:1}
.scr{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:var(--bg);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.25,1);
}
.scr.in{transform:translateX(0)}
.scr.back{transform:translateX(-25%);opacity:.6}
.scr.rev{transform:translateX(-100%)}
/* ---------- header ---------- */
.hdr{
  display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex:0 0 auto;
  border-bottom:2px solid var(--line);
}
.hbtn{
  width:40px;height:40px;border-radius:13px;border:2.5px solid var(--line2);
  background:var(--card);color:var(--ink2);display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex:0 0 auto;
}
.hbtn:active{transform:translate(1px,1px)}
.hbtn svg{width:20px;height:20px}
.htitle{flex:1;text-align:center;font-weight:800;font-size:19px;letter-spacing:.3px}
/* ---------- body ---------- */
.body{flex:1;overflow-y:auto;padding:18px 16px 26px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.big{font-size:26px;font-weight:800;line-height:1.25}
.sub{color:var(--ink2);font-size:15px;font-weight:500;line-height:1.5}
.center{text-align:center}
.mt{margin-top:14px}.mt2{margin-top:24px}
/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:15px 18px;border-radius:16px;cursor:pointer;
  font-family:inherit;font-size:18px;font-weight:800;color:#221a08;
  background:var(--yl);border:3px solid #1a1408;box-shadow:var(--shadow);
  transition:transform .06s;
}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(0,0,0,.55)}
.btn.red{background:var(--red);color:#fff}
.btn.tl{background:var(--tl);color:#062723}
.btn.gr{background:var(--gr);color:#06270f}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line2)}
.btn.sm{padding:10px 14px;font-size:15px;border-radius:12px;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:10px}
/* ---------- cards ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
.hero{border:3px solid #1a1408;box-shadow:6px 6px 0 rgba(0,0,0,.5);border-radius:22px;padding:20px}
/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{
  padding:9px 15px;border-radius:13px;border:2.5px solid var(--line2);
  background:var(--card);color:var(--ink2);font-weight:700;font-size:15px;cursor:pointer;
  display:flex;align-items:center;gap:7px;
}
.chip svg{width:17px;height:17px}
.chip.on{background:var(--yl);color:#221a08;border-color:#1a1408}
/* ---------- players ---------- */
.pl-row{display:flex;align-items:center;gap:11px;background:var(--card);border:2px solid var(--line);border-radius:15px;padding:10px 12px}
.av{width:42px;height:42px;border-radius:14px;border:2.5px solid #1a1408;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#221a08;flex:0 0 auto;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
.av.big{width:96px;height:96px;font-size:38px;border-radius:26px}
.av.lg{width:64px;height:64px;font-size:26px;border-radius:20px}
input,select,textarea{
  font-family:inherit;font-size:16px;font-weight:600;color:var(--ink);
  background:var(--bg2);border:2.5px solid var(--line2);border-radius:13px;
  padding:12px 14px;width:100%;outline:none;
}
input:focus{border-color:var(--yl)}
/* ---------- tabbar ---------- */
.tabbar{flex:0 0 auto;display:flex;border-top:2.5px solid var(--line);background:#14100c;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);cursor:pointer;font-weight:700;font-size:12px;border-top:3px solid transparent;margin-top:-2.5px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--yl);border-top-color:var(--yl)}
/* ---------- game rows ---------- */
.grow{display:flex;align-items:center;gap:13px;background:var(--card);border:2px solid var(--line);border-radius:17px;padding:13px 14px;cursor:pointer;margin-top:11px}
.grow:active{transform:translate(1px,1px)}
.gic{width:46px;height:46px;border-radius:14px;border:2.5px solid #1a1408;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:2.5px 2.5px 0 rgba(0,0,0,.45)}
.gic svg{width:24px;height:24px}
.grow .gt{font-size:17px;font-weight:800}
.grow .gs{font-size:13px;color:var(--ink2);font-weight:600}
.grow .arr{margin-inline-start:auto;color:var(--dim)}
.grow .arr svg{width:18px;height:18px}
/* ---------- word reveal ---------- */
.wordcard{
  background:#14100c;border:3px solid var(--line2);border-radius:22px;padding:34px 22px;text-align:center;
  animation:pop .45s cubic-bezier(.2,1.4,.4,1);
}
.wordcard .w{font-size:42px;font-weight:800;color:var(--yl);line-height:1.2}
.wordcard.red .w{color:var(--red)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .4s}
@keyframes bounceIn{0%{transform:translateY(30px) scale(.8);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes blink{50%{opacity:.35}}
.blink{animation:blink 1s infinite}
@keyframes growBar{from{width:0}}
/* ---------- logo ---------- */
.logo{display:flex;justify-content:center;gap:1px;font-family:'Lilita One',cursive;font-size:56px;color:var(--yl);text-shadow:4px 4px 0 #000;user-select:none}
.logo span{display:inline-block;animation:bounceIn .5s cubic-bezier(.2,1.5,.4,1) both}
.logo-sub{font-family:'Lilita One',cursive;text-align:center;font-size:21px;letter-spacing:14px;color:var(--ink);margin-right:14px;text-shadow:3px 3px 0 #000;margin-top:-4px}
/* ---------- misc ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:8px;background:var(--bg2);border:2px solid var(--line2);color:var(--ink2)}
.tag.y{background:var(--yl);color:#221a08;border-color:#1a1408}
.tag.r{background:var(--red);color:#fff;border-color:#1a1408}
.tag.t{background:var(--tl);color:#062723;border-color:#1a1408}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--yl);color:#221a08;font-weight:800;padding:11px 22px;border-radius:14px;border:3px solid #1a1408;box-shadow:4px 4px 0 rgba(0,0,0,.5);opacity:0;transition:.25s;z-index:99;pointer-events:none;font-size:15px;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:98}
.vs{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;background:var(--card);border:2px solid var(--line);border-radius:16px}
.vs .p{flex:1;text-align:center}
.vs .x{font-family:'Lilita One';font-size:26px;color:var(--red)}
.halves{display:flex;height:100%;position:relative}
.half{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;cursor:pointer;position:relative}
.half .hname{font-size:30px;font-weight:800;text-shadow:3px 3px 0 rgba(0,0,0,.4)}
.buzzname{width:100%;padding:20px;border-radius:18px;border:3px solid #1a1408;font-size:24px;font-weight:800;color:#221a08;box-shadow:var(--shadow);cursor:pointer;transition:.1s}
.buzzname:disabled{opacity:.35;box-shadow:none}
.timerbar{height:12px;border-radius:8px;background:var(--bg2);border:2px solid var(--line2);overflow:hidden}
.timerbar>div{height:100%;background:var(--yl);transition:width .3s linear}
canvas.pad{background:#f7efdd;border-radius:16px;border:3px solid #1a1408;touch-action:none;box-shadow:5px 5px 0 rgba(0,0,0,.45);width:100%;display:block}
.score-pill{display:flex;justify-content:space-between;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:9px 14px;font-weight:800;margin-top:9px}
.bar{height:22px;background:var(--bg2);border:2px solid var(--line2);border-radius:8px;overflow:hidden;margin-top:6px}
.bar>div{height:100%;border-radius:5px;animation:growBar .6s ease;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:800;color:#221a08;min-width:34px}
.flip{perspective:900px}
.flipin{transition:transform .6s;transform-style:preserve-3d;position:relative}
.flipin.flipped{transform:rotateY(180deg)}
.ff,.bb{backface-visibility:hidden}
.bb{position:absolute;inset:0;transform:rotateY(180deg);display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="frame"><div id="stage"></div></div>
<div id="toast"></div>
<canvas id="fx"></canvas>
<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TIMERS=[];
const tm=(f,ms)=>{const id=setTimeout(f,ms);TIMERS.push(id);return id};
const iv=(f,ms)=>{const id=setInterval(f,ms);TIMERS.push(id);return id};
const clearTimers=()=>{TIMERS.forEach(clearInterval);TIMERS=[]};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)}
const wait=(ms,f)=>tm(f,ms);
const pad2=n=>String(n).padStart(2,'0');

/* ============ icons (SVG) ============ */
const I={};
I.back=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>`;
I.snd=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12"/></svg>`;
I.mute=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M16 9l6 6M22 9l-6 6"/></svg>`;
I.dice=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.6" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.6" fill="currentColor" stroke="none"/></svg>`;
I.users=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20c.8-3.4 3.4-5 6.5-5s5.7 1.6 6.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 15.2c2.6.3 4.6 1.8 5.3 4.8"/></svg>`;
I.pad=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 8h10M6 11h12M9 8v11M15 8v11"/><rect x="2.5" y="4" width="19" height="17" rx="4.5"/></svg>`;
I.crown=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 8l4 4 5-7 5 7 4-4v10H3z"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/></svg>`;
I.ghost=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3a7 7 0 00-7 7v11l2.5-2 2.3 2 2.2-2 2.2 2 2.3-2L19 21V10a7 7 0 00-7-7z"/><circle cx="9.5" cy="11" r="1.2" fill="currentColor" stroke="none"/><circle cx="14.5" cy="11" r="1.2" fill="currentColor" stroke="none"/></svg>`;
I.zap=`<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>`;
I.brain=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3a3 3 0 00-3 3 3 3 0 00-2.5 4.5A3 3 0 005 15a3.5 3.5 0 004.5 3.4V3zM14.5 3a3 3 0 013 3 3 3 0 012.5 4.5A3 3 0 0119 15a3.5 3.5 0 01-4.5 3.4V3z"/><path d="M9.5 18.5c0 1.5 1 2.5 2.5 2.5s2.5-1 2.5-2.5"/></svg>`;
I.brush=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l5 5-8.5 8.5a3.5 3.5 0 11-5-5L15 4z"/><path d="M5 20l1.5-4"/></svg>`;
I.music=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="17.5" cy="16" r="2.6"/></svg>`;
I.target=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.8"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>`;
I.mic=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></svg>`;
I.q=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8.5 9a3.5 3.5 0 116 2.4c-1 1.1-2.5 1.6-2.5 3.6"/><circle cx="12" cy="18.5" r="1.2" fill="currentColor" stroke="none"/></svg>`;
I.eye=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
I.swords=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l6 6M21 3l-6 6M3 3v4M3 3h4M21 3v4M21 3h-4M6 15l3 3 6-6 3 3M9 18l-3 3M18 12l3-3"/></svg>`;
I.trophy=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 01-10 0V4z"/><path d="M7 5H4a3 3 0 003 4M17 5h3a3 3 0 01-3 4M12 14v4M8.5 21h7"/></svg>`;
I.star=`<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>`;
I.fire=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="M12 2.5c1 3-1.5 4.5-2.5 6.5-1 2 .5 3 .5 3S8 11 7 9C5.5 11.5 5 13 5 15a7 7 0 0014 0c0-4-3.5-6-4-9-1.2 1.5-2 2.5-3 3.5.8-3 .8-5 0-7z"/></svg>`;
I.play=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>`;
I.check=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>`;
I.next=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`;
I.money=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="6" width="19" height="12" rx="3"/><circle cx="12" cy="12" r="3"/><path d="M5.5 9v0M18.5 15v0" stroke-linecap="round"/></svg>`;
I.pizza=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5A10.5 10.5 0 013 9.5z"/><path d="M12 3v18"/><circle cx="8" cy="9" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="9" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="15" r="1" fill="currentColor" stroke="none"/></svg>`;
I.brief=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2M3 12h18"/></svg>`;
I.paw=`<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="7" cy="8" r="2"/><circle cx="12" cy="6" r="2.1"/><circle cx="17" cy="8" r="2"/><path d="M12 11.5c-3 0-5.5 2.5-5.5 4.8 0 1.5 1.2 2.4 2.6 2.4 1 0 1.8-.4 2.9-.4s1.9.4 2.9.4c1.4 0 2.6-.9 2.6-2.4 0-2.3-2.5-4.8-5.5-4.8z"/></svg>`;

/* ============ audio ============ */
let AC=null,MUTED=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,vol,delay){
  if(MUTED)return;const c=ac();if(!c)return;
  const t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';o.frequency.value=f;
  g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);
}
const sfx={
  tap:()=>tone(620,.06,'square',.07),
  pop:()=>{tone(500,.08,'triangle',.14);tone(750,.09,'triangle',.1,.05)},
  good:()=>{tone(620,.09,'square',.1);tone(880,.12,'square',.1,.08)},
  bad:()=>{tone(180,.2,'sawtooth',.12);tone(140,.22,'sawtooth',.1,.07)},
  tick:()=>tone(950,.04,'square',.05),
  roll:()=>{for(let i=0;i<8;i++)tone(140+Math.random()*40,.05,'triangle',.09,i*.09)},
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.11,i*.12));tone(1319,.3,'triangle',.1,.5)},
  drum:()=>{for(let i=0;i<3;i++)tone(90,.12,'sine',.2,i*.16)}
};

/* ============ confetti ============ */
function confetti(n){
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#ffc93d','#ff5d5d','#38d3c0','#4ecb71','#ff8f3d','#e86fa4'];
  const ps=Array.from({length:n||130},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,w:6+Math.random()*7,h:4+Math.random()*5,v:2.2+Math.random()*3.6,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.25,col:rnd(cols)}));
  let t=0;
  const loop=()=>{t++;x.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{p.y+=p.v;p.r+=p.vr;if(p.y>c.height+20){p.y=-15;p.x=Math.random()*c.width}
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(t<300)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height)};
  requestAnimationFrame(loop);
}

let P={};
try{P=JSON.parse(localStorage.getItem('shala_profiles')||'{}')}catch(e){P={}}
function saveP(){localStorage.setItem('shala_profiles',JSON.stringify(P))}
function pf(name){
  if(!P[name])P[name]={xp:0,wins:0,streak:0,imp:0,trivia:0,draw:0,music:0,likely:0,games:0};
  return P[name];
}
function award(name,xp,st){
  const p=pf(name);p.xp+=xp;p.games=(p.games||0)+1;
  if(st)Object.entries(st).forEach(([k,v])=>p[k]=(p[k]||0)+v);
  saveP();
}
function levelOf(p){return Math.floor(p.xp/500)+1}
function badgesOf(p){
  const b=[];
  if((p.imp||0)>=3)b.push(['Master Imposter','r']);
  if((p.trivia||0)>=3)b.push(['Brain','t']);
  if((p.draw||0)>=2)b.push(['Artist','y']);
  if((p.music||0)>=2)b.push(['Music Freak','y']);
  if((p.likely||0)>=3)b.push(['Clown of the Group','y']);
  if(p.streak>=2)b.push(['On Fire','r']);
  if(p.wins>=10)b.push(['Legend','r']);
  return b;
}

  const sc=document.createElement('div');sc.className='scr';$('#stage').appendChild(sc);

  sc.insertAdjacentHTML('beforeend',`<div class="cd" style="position:absolute;inset:0;background:rgba(13,11,9,.92);display:flex;align-items:center;justify-content:center;z-index:5"><div style="font-family:'Lilita One';font-size:110px;color:var(--yl);text-shadow:6px 6px 0 #000">${secs}</div></div>`);
  const cd=sc.querySelector('.cd');

  iv(()=>{
    n--;onTick&&onTick(n);
    if(n<=0){cd.remove();onEnd()}
    else{cd.firstElementChild.textContent=n;cd.firstElementChild.style.transform='scale(1.15)';setTimeout(()=>cd.firstElementChild.style.transform='scale(1)',120);sfx.tick()}
  },1000);
  sfx.tick();
}

function mountPad(sc,onDone,secs,word){

    </div>

  </div>`;
  sc.querySelector('.dcol[data-i="e"]').textContent='ممحاة';
  let color=DCOLS[0],lw=7;
  const cv=sc.querySelector('canvas.pad');
  const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return {x:(t.clientX-r.left)*cv.width/r.width,y:(t.clientY-r.top)*cv.height/r.height}};
  const start=e=>{e.preventDefault();drawing=true;cur=[{...pos(e),color,w:lw}]};
  const move=e=>{e.preventDefault();if(!drawing)return;cur.push({...pos(e),color,w:lw});paint()};
  const end=()=>{if(drawing&&cur.length>1)strokes.push(cur);else if(drawing)strokes.push(cur);cur=[];drawing=false;paint()};
  cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});
  cv.addEventListener('touchend',end);cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',e=>{if(drawing)move(e)});window.addEventListener('mouseup',end);
  sc.querySelectorAll('.dcol').forEach(d=>d.onclick=()=>{
    const v=d.dataset.i;
    color=v==='e'?'#f7efdd':DCOLS[+v];lw=v==='e'?26:7;sfx.tap();
    sc.querySelectorAll('.dcol').forEach(x=>x.style.borderColor='#1a1408');d.style.borderColor='var(--yl)';
  });

  sc.querySelector('.btn').onclick=()=>{clearInterval(tiv);onDone(cv)};
  paint();
}

let SO={};
const SOLOBEST=()=>JSON.parse(localStorage.getItem('shala_solo')||'{}');
const sbest=(k,v,lowerBetter)=>{
  const b=SOLOBEST();
  if(!b[k]||(lowerBetter?v<b[k]:v>b[k])){b[k]=v;localStorage.setItem('shala_solo',JSON.stringify(b));return true}
  return false;
};

function soloReaction(){
  go(sc=>{
    let state='wait',t0=0,tries=0,sum=0;
    sc.innerHTML=`${hdr('Reaction — سرعة البديهة')}
    <div class="body" style="display:flex;flex-direction:column;gap:14px;justify-content:center">
      <div id="rx" style="border-radius:22px;border:3px solid #1a1408;height:300px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;cursor:pointer;background:var(--red);color:#fff">استنى الأخضر...</div>

    </div>`;
    const box=$('#rx');

      state='wait';box.style.background='var(--red)';box.textContent='استنى الأخضر...';
      tm(()=>{if(state!=='wait')return;state='go';box.style.background='var(--gr)';box.textContent='دوس!!!';t0=Date.now();sfx.pop()},1200+Math.random()*2600);
    };
    const press=()=>{

        const ms=Date.now()-t0;sum+=ms;tries++;
        state='idle';box.style.background='var(--yl)';box.style.color='#221a08';box.textContent=ms+'ms';
        sfx.good();
        if(tries>=3){
          const avg=Math.round(sum/3);
          const rec=sbest('reaction',avg,true);
          const me=S.players[0];
          if(me)award(me.name,Math.max(10,Math.round(Math.max(0,700-avg))),{});
          if(avg<300&&me){P[me.name].streak=(P[me.name].streak||0);saveP()}

          box.textContent=avg+'ms متوسط'+(rec?' — رقم قياسي جديد!':'');

          confetti(70);sfx.win();
          wait(2200,()=>tabs.solo());
        }else arm();
      }else if(state==='wait'){
        state='idle';box.style.background='var(--red)';box.textContent='دست بدري! استنى...';
        sfx.bad();tries++;sum+=700;
        if(tries>=3){wait(1500,()=>tabs.solo())}else arm();
      }
    };
    box.onpointerdown=press;
    box.ontouchstart=e=>{e.preventDefault();press()};
  });

    const deck=shuffle([...SYMS,...SYMS]).map((s,i)=>({s,i,open:false,done:false}));
    let open=[],moves=0,t0=Date.now();
    const render=()=>{
      sc.innerHTML=`${hdr('Memory Cards')}
      <div class="body">
        <div class="card center"><b>نقلات: <span id="mv">${moves}</span></b> — طابق الأزواج الثمانية</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px">
          ${deck.map(c=>`<button class="btn sm mc" data-i="${c.i}" style="padding:0;height:74px;${c.done?'background:var(--gr)':''};${c.open?'background:#f7efdd':''}">${c.open||c.done?symSVG(c.s):I.q.replace('<svg','<svg width="30" height="30"')}</button>`).join('')}
        </div>
      </div>`;
      sc.querySelectorAll('.mc').forEach(b=>b.onclick=()=>flip(+b.dataset.i));
    };
    const flip=i=>{
      const c=deck[i];
      if(c.done||c.open)return;
      c.open=true;open.push(c);sfx.tick();
      if(open.length===2){
        moves++;const mv=$('#mv');if(mv)mv.textContent=moves;
        const [a,b]=open;
        if(a.s===b.s){a.done=b.done=true;open=[];sfx.good();render();
          if(deck.every(x=>x.done)){
            const secs=(Date.now()-t0)/1000;
            const rec=sbest('cards',moves,true);
            if(S.players[0])award(S.players[0].name,Math.max(10,60-moves*2),{});
            saveP();confetti(90);sfx.win();
            toast('خلصت في '+moves+' نقلة'+(rec?' — رقم قياسي!':''));
            wait(2200,()=>tabs.solo());
          }
        }else{
          sfx.bad();
          wait(750,()=>{a.open=b.open=false;open=[];render()});
        }
      }
      render();
    };
    render();
  });
}
function soloScramble(){

    const words=shuffle(SCRAM.filter(w=>w.length>=4)).slice(0,10);

      const letters=word();
      sc.innerHTML=`${hdr('Word Scramble — '+(wi+1)+'/10')}

            NOBACK=true;

              s2.innerHTML=`${hdr('Word Scramble')}

    render();

function soloPattern(){
  go(sc=>{
    let seq=[Math.floor(Math.random()*4)],showing=true,level=1;
    const PCOL=['#ff5d5d','#ffc93d','#38d3c0','#4ecb71'];
    const render=(hl=-1)=>{
      sc.innerHTML=`${hdr('Pattern — مستوى '+level)}
      <div class="body" style="display:flex;flex-direction:column;gap:14px;justify-content:center">
        <div class="sub center" id="pst">راقب النمط...</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          ${[0,1,2,3].map(i=>`<button class="btn pp" data-i="${i}" style="padding:0;height:110px;background:${PCOL[i]};${hl===i?'outline:6px solid #fff':''}"></button>`).join('')}
        </div>
      </div>`;
      sc.querySelectorAll('.pp').forEach(b=>b.onclick=()=>tap(+b.dataset.i));
    };
    const play=()=>{
      showing=true;
      seq.forEach((p,k)=>tm(()=>{
        render(p);sfx.tick();
        tm(()=>render(),380);
        if(k===seq.length-1)tm(()=>{showing=false;const e=$('#pst');if(e)e.textContent='دلوقتي كده النمط!'},k===seq.length-1?600:0);
      },700+k*650));
    };
    let idx=0;
    const tap=i=>{
      if(showing)return;
      sfx.tap();render(i);tm(()=>render(),150);
      if(seq[idx]===i){idx++;if(idx>=seq.length){level++;idx=0;seq.push(Math.floor(Math.random()*4));sfx.good();tm(play,800)}}
      else{
        sfx.bad();
        const rec=sbest('pattern',level-1,false);
        if(S.players[0])award(S.players[0].name,(level-1)*10,{});
        saveP();
        NOBACK=true;
        go(s2=>{
          s2.innerHTML=`${hdr('Pattern — النتيجة')}
          <div class="body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">
            <div class="wordcard"><div class="sub">وصلت لمستوى</div><div class="w">${level-1}</div><div class="sub">${rec?'رقم قياسي جديد!':''}</div></div>
            <button class="btn" onclick="tabs.solo()">${I.back} ارجع</button>
          </div>`;
        });
      }
    };
    render();play();
  });
}

function teChain(){
  let cur=rnd(['مدرسة','عربية','كورة','نهار','بيت','فرح']),used=new Set(),round=0;
  const next=()=>{
    if(round>=12||TE.sa+TE.sb>=6)return teEnd();
    round++;
    const team=round%2?TE.A:TE.B;
    const pi=team[round%team.length];
    NOBACK=true;
    go(sc=>{
      sc.innerHTML=`${hdr('Chain Relay')}
      <div class="body" style="display:flex;flex-direction:column;gap:12px;justify-content:center">
        <div class="card center" style="border-color:${round%2?'var(--tl)':'var(--red)'}"><b>الفريق ${round%2?'الأزرق':'الأحمر'}</b> — <b>${esc(S.players[pi].name)}</b> عليه الدور</div>
        <div class="wordcard"><div class="sub">الكلمة:</div><div class="w">${esc(cur)}</div><div class="sub">اكتب كلمة تبدأ بـ "${esc(cur[cur.length-1])}"</div></div>
        <input id="tcw" placeholder="كلمتك..." maxlength="20">
        <button class="btn" onclick="teChainSend(${pi})">${I.check} ابعت</button>
        <div class="timerbar"><div id="tcb" style="width:100%"></div></div>
      </div>`;
      let t=8;
      iv(()=>{t--;const b=$('#tcb');if(b)b.style.width=(t/8*100)+'%';
        if(t<=0){sfx.bad();toast('الوقت خلص! نقطة للخصم');
          round%2?TE.sb++:TE.sa++;cur=rnd(['بيت','لعب','نهار','كورة']);next();}},1000);
    });
  };
  window.teChainSend=pi=>{
    const v=$('#tcw').value.trim();
    if(!v)return toast('اكتب كلمة!');
    const norm=c=>c.replace(/[ةه]/g,'ه').replace(/[ىي]/g,'ي').replace(/[أإآا]/g,'ا');
    if(norm(v[0])!==norm(cur[cur.length-1])||used.has(v)){
      sfx.bad();toast('غلط! نقطة للخصم');round%2?TE.sb++:TE.sa++;
    }else{used.add(v);cur=v;sfx.good();round%2?TE.sa++:TE.sb++;toast('صح!')}
    next();
  };
  next();
}
function teRelay(){
  const times={A:[],B:[]};
  const run=(team,member)=>{
    if(member>=team.length){
      if(team===TE.A)return run(TE.B,0);
      return finish();
    }
    goPass(team[member],'اختبر سرعة بديهتك للفريق',()=>{
      NOBACK=true;
      go(sc=>{
        sc.innerHTML=`${hdr('Reaction Relay')}
        <div class="body" style="display:flex;flex-direction:column;justify-content:center;gap:12px">
          <div class="sub center">${esc(S.players[team[member]].name)} — استنى الأخضر</div>
          <div id="rx" style="border-radius:22px;border:3px solid #1a1408;height:280px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;background:var(--red);color:#fff;cursor:pointer">استنى...</div>
        </div>`;
        const box=$('#rx');let state='wait',t0;
        tm(()=>{if(state!=='wait')return;state='go';box.style.background='var(--gr)';box.textContent='دوس!';t0=Date.now();sfx.pop()},1200+Math.random()*2200);
        const press=()=>{
          if(state==='go'){
            const ms=Date.now()-t0;
            (team===TE.A?times.A:times.B).push(ms);
            sfx.good();toast(ms+'ms');
            run(team,member+1);
          }else{state='early';box.textContent='بدري! محاولة تانية';sfx.bad();tm(()=>{state='wait'},1000)}
        };
        box.onpointerdown=press;box.ontouchstart=e=>{e.preventDefault();press()};
      });
    });
  };
  const finish=()=>{
    const avg=a=>Math.round(a.reduce((s,x)=>s+x,0)/a.length);
    TE.sa=Math.max(0,700-avg(times.A));
    TE.sb=Math.max(0,700-avg(times.B));
    toast('متوسط الأزرق: '+avg(times.A)+'ms — الأحمر: '+avg(times.B)+'ms');
    teEnd();
  };
  run(TE.A,0);
}

      </div>`;
      const box=$('#rx');let state='wait',t0;
      tm(()=>{if(state!=='wait')return;state='go';box.style.background='var(--gr)';box.textContent='دوس!';t0=Date.now();sfx.pop()},1200+Math.random()*2500);
      const press=()=>{
        if(state==='go'){
          const ms=Date.now()-t0;const pts=Math.max(0,600-ms);
          CH.scores[S.players[i].name]+=pts;award(S.players[i].name,Math.round(pts/4),{});saveP();
          sfx.good();toast(ms+'ms — +'+pts+' نقطة');
          chReaction(i+1);
        }
      };
      box.onpointerdown=press;box.ontouchstart=e=>{e.preventDefault();press()};
    });
  });
}
/* R4 most likely */
function chLikely(ri){
  if(ri>=4)return champStandings('champRound(4)');
  CH.lkQ=rnd(LIKELY);CH.lkVotes={};CH.lkI=0;
  chLkVote(0);
}
function chLkVote(vi){
  if(vi>=S.players.length){
    const cnt={};Object.values(CH.lkVotes).forEach(j=>cnt[j]=(cnt[j]||0)+1);
    const top=+Object.keys(cnt).reduce((a,b)=>cnt[b]>cnt[a]?b:a);
    CH.scores[S.players[top].name]+=25;award(S.players[top].name,25,{likely:1});saveP();
    sfx.win();confetti(50);
    toast('الشلة اختارت: '+S.players[top].name+'! +25');
    return chLikely(CH.lkI+1);
  }
  goPass(vi,'مين أكتر واحد...؟',()=>{
    NOBACK=true;
    go(sc=>{
      sc.innerHTML=`${hdr('Most Likely — بطولة')}
      <div class="body">
        <div class="wordcard"><div class="sub">مين أكتر واحد...</div><div class="w" style="font-size:23px">${esc(CH.lkQ)}</div></div>
        ${S.players.map((p,j)=>j===vi?'':`<div class="grow" onclick="chLkCast(${vi},${j})">${avHTML(j)}<div class="gt">${esc(p.name)}</div></div>`).join('')}
      </div>`;
    });
  });
}
function chLkCast(vi,j){CH.lkVotes[vi]=j;sfx.pop();chLkVote(vi+1)}
/* R5 mission */
function chMission(){
  const ms=shuffle(MISSIONS).slice(0,S.players.length);
  CH.mlist=S.players.map((p,i)=>{
    const other=S.players[(i+1)%S.players.length].name;
    return ms[i].replace('{p}',other).replace('{w}',rnd(WWORDS));
  });
  CH.mi=0;
  const reveal=i=>{
    if(i>=S.players.length)return chMPlay();
    goPass(i,'(بطولة) مهمتك السرية',()=>{
      NOBACK=true;
      go(sc=>{
        sc.innerHTML=`${hdr('المهمة السرية')}
        <div class="body" style="display:flex;flex-direction:column;justify-content:center;gap:14px">
          ${avHTML(i)}
          <div class="wordcard"><div class="w" style="font-size:21px">${esc(CH.mlist[i])}</div></div>
          <button class="btn" onclick="sfx.pop();reveal(${i+1})">${I.check} حفظتها — سلّم</button>
        </div>`;
      });
    });
  };
  const chMPlay=()=>{
    NOBACK=true;
    go(sc=>{
      sc.innerHTML=`${hdr('نفّذوا المهام')}
      <div class="body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">
        <div class="big center">5 دقايق — نفّذوا مهامكم في الخفا</div>
        <button class="btn gr" onclick="sfx.pop();chMDeclare(0)">${I.check} مين نفّذ؟</button>
      </div>`;
    });
  };
  window.chMDeclare=i=>{
    if(i>=S.players.length)return champStandings('champRound(5)');
    goPass(i,'نفّذت مهمتك؟ (بضميرك)',()=>{
      NOBACK=true;
      go(sc=>{
        sc.innerHTML=`${hdr('المهمة — '+esc(S.players[i].name))}
        <div class="body" style="display:flex;flex-direction:column;justify-content:center;gap:12px">
          <div class="card center">${esc(CH.mlist[i])}</div>
          <div class="row"><button class="btn gr" onclick="chMMark(${i},1)">${I.check} نفّذتها (+100)</button><button class="btn red" onclick="chMMark(${i},0)">لأ</button></div>
        </div>`;
      });
    });
  };
  window.chMMark=(i,ok)=>{
    if(ok){CH.scores[S.players[i].name]+=100;award(S.players[i].name,100,{wins:1,streak:1});saveP();sfx.good()}
    chMDeclare(i+1);
  };
  reveal(0);
}
/* R6 numbers */
function chNumbers(i){
  if(i>=S.players.length)return champStandings('champRound(6)');
  goPass(i,'(بطولة) Number Rush',()=>{
    NOBACK=true;
    go(sc=>{
      const nums=shuffle([...Array(25).keys()].map(x=>x+1));
      let next=1;const t0=Date.now();
      sc.innerHTML=`${hdr('Number Rush — '+esc(S.players[i].name))}
      <div class="body">
        <div class="card center"><b>دوس بالترتيب:</b> <span class="tag y" id="nn">1</span></div>
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px">
          ${nums.map(n=>`<button class="btn sm num" data-n="${n}" style="padding:0;height:56px;font-size:20px">${n}</button>`).join('')}
        </div>
      </div>`;
      sc.querySelectorAll('.num').forEach(b=>b.onclick=()=>{
        if(+b.dataset.n===next){
          b.style.background='var(--tl)';b.disabled=true;sfx.tick();next++;
          const el=$('#nn');if(el)el.textContent=next<=25?next:'تم';
          if(next>25){
            const secs=(Date.now()-t0)/1000;
            const pts=Math.max(0,Math.round(150-secs));
            CH.scores[S.players[i].name]+=pts;award(S.players[i].name,Math.round(pts/3),{});saveP();
            toast(secs.toFixed(1)+' ثانية — +'+pts);
            chNumbers(i+1);
          }
        }else sfx.bad();
      });
    });
  });
}
/* R7 final */
function chFinal(){
  const ranked=Object.entries(CH.scores).sort((a,b)=>b[1]-a[1]);
  const top2=ranked.slice(0,2);
  const iA=S.players.findIndex(p=>p.name===top2[0][0]);
  const iB=S.players.findIndex(p=>p.name===top2[1][0]);
  NOBACK=true;
  go(sc=>{
    sc.innerHTML=`${hdr('FINAL CHAOS')}
    <div class="body" style="display:flex;flex-direction:column;gap:14px;justify-content:center">
      <div class="big center">النهائي!</div>
      <div class="vs"><div class="p">${avHTML(iA)}<b>${esc(S.players[iA].name)}</b></div><div class="x">VS</div><div class="p">${avHTML(iB)}<b>${esc(S.players[iB].name)}</b></div></div>
      <div class="sub center">Fastest Finger — أول 2 انتصارات بياخد الجولة (+250 نقطة)</div>
      <button class="btn" onclick="sfx.pop();chFinalGo(${iA},${iB})">${I.play} FINAL GO</button>
    </div>`;
  });
}
function chFinalGo(a,b){
  AR={a,b,game:0,sa:0,sb:0,final:true};
  arFastestFinal(a,b);
}
function arFastestFinal(a,b){
  NOBACK=true;
  go(sc=>{
    let round=0;
    sc.innerHTML=`${hdr('FINAL — Fastest Finger')}
    <div class="halves" style="flex:1">
      <div class="half" id="h0" style="background:${pcol(a)}33"><div class="hname" style="color:${pcol(a)}">${esc(S.players[a].name)}</div><div class="big blink" id="st0">استعدوا...</div><div class="sub" id="ss0">0</div></div>
      <div class="half" id="h1" style="background:${pcol(b)}33;border-inline-start:3px solid var(--line)"><div class="hname" style="color:${pcol(b)}">${esc(S.players[b].name)}</div><div class="big blink" id="st1">استعدوا...</div><div class="sub" id="ss1">0</div></div>
    </div>`;
    let sa=0,sb=0,ready=false,goT=null;
    const upd=()=>{const x=$('#ss0'),y=$('#ss1');if(x)x.textContent=sa;if(y)y.textContent=sb};
    const newRound=()=>{
      if(sa>=2||sb>=2)return finish();
      if(!sc.isConnected)return;
      $('#st0').textContent='استعدوا...';$('#st0').classList.add('blink');
      ready=false;
      goT=tm(()=>{ready=true;$('#st0').textContent='دوس!';$('#st0').classList.remove('blink');sfx.pop();
        tm(()=>{if(ready)finish(-1)},1300);
      },1500+Math.random()*2500);
    };
    const finish=(side)=>{
      ready=false;clearTimeout(goT);
      if(side>=0){
        if(side===0)sa++;else sb++;
        upd();sfx.good();
      }
      if(sa>=2||sb>=2){
        const winner=sa>sb?a:b;
        CH.scores[S.players[winner].name]+=250;
        award(S.players[winner].name,300,{wins:1,streak:1});
        S.players.forEach(p=>{if(p.name!==S.players[winner].name)P[p.name].streak=0});
        saveP();
        return chEnd(winner);
      }
      wait(1300,newRound);
    };
    [0,1].forEach(side=>{
      const el=$('#h'+side);
      const h=e=>{e.preventDefault();if(!sc.isConnected||!ready&&true){};
        if(ready)finish(side);
        else if(goT){finish(side===0?1:0)}
      };
      el.addEventListener('touchstart',h,{passive:false});
      el.addEventListener('mousedown',h);
    });
    newRound();
  });
}
function chEnd(winner){
  NOBACK=true;
  go(sc=>{
    const ranked=Object.entries(CH.scores).sort((a,b)=>b[1]-a[1]);
    confetti(200);sfx.win();
    sc.innerHTML=`${hdr('PARTY CHAMPION')}
    <div class="body" style="display:flex;flex-direction:column;gap:14px">
      <div class="wordcard" style="border-color:var(--yl)">
        <div class="gic" style="background:var(--yl);width:70px;height:70px;margin:0 auto 10px">${I.crown}</div>
        <div class="sub">ملك الشلة لهذا اليوم</div>
        <div class="w" style="font-size:38px">${esc(S.players[winner].name)}</div>
        <div class="sub">${CH.scores[S.players[winner].name]} نقطة • +300 XP • Streak محفوظ</div>
      </div>
      ${ranked.map((r,i)=>`<div class="score-pill" style="${i===0?'border-color:var(--yl)':''}"><span>${i+1}. ${esc(r[0])}</span><b>${r[1]}</b></div>`).join('')}
      <button class="btn mt2" onclick="sfx.tap();tabs.champ()">${I.crown} بطولة تانية</button>
    </div>`;
  });
}

/* ============ RANDOM PARTY ============ */
function randomParty(){
  const opts=['imposterSetup()','askmeSetup()','likelySetup()','missionSetup()','lyingSetup()','musicSetup()'];
  const names=['IMPOSTER!','ASK ME!','MOST LIKELY!','SECRET MISSION!','WHO IS LYING؟','MUSIC BATTLE!'];
  NOBACK=true;
  go(sc=>{
    sc.innerHTML=`${hdr('RANDOM PARTY')}
    <div class="body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px">
      <div class="gic" style="background:var(--yl);width:80px;height:80px;animation:floaty 2s infinite">${I.dice}</div>
      <div class="big" id="rr" style="font-size:34px;text-align:center">؟؟؟</div>
      <div class="sub">بنلف على لعبة النهارده...</div>
    </div>`;
    let i=0,n=0;
    const total=18;
    iv(()=>{
      i=(i+1)%names.length;
      $('#rr').textContent=names[i];
      sfx.tick();n++;
      if(n>=total){
        const pick=Math.floor(Math.random()*opts.length);
        $('#rr').textContent=names[pick];
        sfx.win();
        tm(()=>{NOBACK=false;eval(opts[pick])},900);
      }
    },110);
  });
}

splash();
document.addEventListener('pointerdown',()=>ac(),{once:true});
