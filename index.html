<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171310">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FAWDA</title>
<style>
:root{--bg:#171310;--card:#251f17;--line:#3b3227;--line2:#4a3e2f;--ink:#f7efdd;--ink2:#b6a68d;--yl:#ffc93d;--red:#ff5d5d;--tl:#38d3c0;--gr:#4ecb71;--or:#ff8f3d;--pk:#e86fa4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Tahoma',sans-serif;color:var(--ink);background:#0d0b09;display:flex;align-items:center;justify-content:center;overflow:hidden}
#frame{position:relative;width:min(430px,100vw);height:min(900px,100dvh);background:var(--bg);overflow:hidden}
@media(min-width:480px){#frame{border:2px solid #33291c;border-radius:26px;box-shadow:0 30px 80px #000a}}
#okbar{position:absolute;top:0;left:0;right:0;height:5px;background:var(--gr);z-index:50}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.hdr{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:2px solid var(--line)}
.hbtn{width:40px;height:40px;border-radius:13px;border:2px solid var(--line2);background:var(--card);color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.hbtn svg{width:20px;height:20px}
.htitle{flex:1;text-align:center;font-weight:800;font-size:18px}
.body{flex:1;overflow-y:auto;padding:18px 16px 26px}
.big{font-size:24px;font-weight:800;line-height:1.35}
.sub{color:var(--ink2);font-size:15px;line-height:1.6}
.center{text-align:center}
.mt{margin-top:14px}.mt2{margin-top:24px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;cursor:pointer;font-family:inherit;font-size:17px;font-weight:800;color:#221a08;background:var(--yl);border:3px solid #1a1408;box-shadow:4px 4px 0 #0008}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #0008}
.btn.red{background:var(--red);color:#fff}.btn.tl{background:var(--tl)}.btn.gr{background:var(--gr)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line2)}
.btn.sm{padding:10px 12px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.4;pointer-events:none}
.btn svg{width:18px;height:18px;flex:0 0 auto}
.row{display:flex;gap:10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:9px 15px;border-radius:13px;border:2px solid var(--line2);background:var(--card);color:var(--ink2);font-weight:700;font-size:14px;cursor:pointer}
.chip.on{background:var(--yl);color:#221a08;border-color:#1a1408}
.av{width:42px;height:42px;border-radius:14px;border:2px solid #1a1408;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#221a08;flex:0 0 auto}
.av.big{width:96px;height:96px;font-size:38px;border-radius:26px}
input{font-family:inherit;font-size:16px;font-weight:600;color:var(--ink);background:#211b15;border:2px solid var(--line2);border-radius:13px;padding:12px 14px;width:100%;outline:none}
input:focus{border-color:var(--yl)}
.tabbar{flex:0 0 auto;display:flex;border-top:2px solid var(--line);background:#14100c}
.tab{flex:1;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8a7b64;cursor:pointer;font-weight:700;font-size:12px;border-top:3px solid transparent;margin-top:-2.5px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--yl);border-top-color:var(--yl)}
.grow{display:flex;align-items:center;gap:13px;background:var(--card);border:2px solid var(--line);border-radius:17px;padding:13px 14px;cursor:pointer;margin-top:11px}
.grow:active{transform:translate(1px,1px)}
.gic{width:46px;height:46px;border-radius:14px;border:2px solid #1a1408;flex:0 0 auto;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 #0006}
.gic svg{width:24px;height:24px}
.grow .gt{font-size:16px;font-weight:800}
.grow .gs{font-size:12px;color:var(--ink2)}
.grow .arr{margin-inline-start:auto;color:#8a7b64}
.grow .arr svg{width:16px;height:16px;display:block}
.wordcard{background:#14100c;border:3px solid var(--line2);border-radius:22px;padding:30px 20px;text-align:center;animation:pop .4s}
.wordcard .w{font-size:36px;font-weight:800;color:var(--yl);line-height:1.3}
.wordcard.red .w{color:var(--red)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes blink{50%{opacity:.35}}
.blink{animation:blink 1s infinite}
@keyframes floaty{50%{transform:translateY(-9px)}}
.logo{display:flex;justify-content:center;font-size:40px;color:var(--yl);text-shadow:3px 3px 0 #000;direction:ltr;letter-spacing:2px}
.logosub{text-align:center;font-size:15px;letter-spacing:8px;color:var(--ink);text-shadow:2px 2px 0 #000;margin-right:8px;margin-top:-2px;direction:ltr}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--yl);color:#221a08;font-weight:800;padding:11px 20px;border-radius:14px;border:3px solid #1a1408;opacity:0;transition:.25s;z-index:99;pointer-events:none;font-size:14px;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:98}
#errbox{display:none;position:fixed;left:10px;right:10px;bottom:10px;background:var(--red);color:#fff;border:3px solid #1a1408;border-radius:14px;padding:12px;font-size:13px;font-weight:700;z-index:200}
.vs{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;background:var(--card);border:2px solid var(--line);border-radius:16px}
.vs .p{flex:1;text-align:center}.vs .x{font-size:26px;color:var(--red);font-weight:800}
.halves{display:flex;height:100%}
.half{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;cursor:pointer}
.half .hname{font-size:26px;font-weight:800;text-shadow:3px 3px 0 #0006}
canvas.pad{background:#f7efdd;border-radius:16px;border:3px solid #1a1408;touch-action:none;box-shadow:5px 5px 0 #0007;width:100%;display:block}
.score-pill{display:flex;justify-content:space-between;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:9px 14px;font-weight:800;margin-top:9px}
.bar{height:22px;background:#211b15;border:2px solid var(--line2);border-radius:8px;overflow:hidden;margin-top:6px}
.bar>div{height:100%;border-radius:5px;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:800;color:#221a08;min-width:30px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:8px;background:#211b15;border:2px solid var(--line2);color:var(--ink2)}
.tag.y{background:var(--yl);color:#221a08;border-color:#1a1408}
</style>
</head>
<body>
<div id="frame"><div id="okbar"></div><div id="stage"></div></div>
<div id="toast"></div><div id="errbox"></div>
<canvas id="fx"></canvas>

<script>
/* ============ CORE ============ */
window.addEventListener('error',function(e){
  var b=document.getElementById('errbox');
  if(b){b.style.display='block';b.textContent='خطأ: '+(e.message||'؟');}
});
var $=function(s){return document.querySelector(s)};
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var TIMERS=[];
function tm(f,ms){var id=setTimeout(f,ms);TIMERS.push(id);return id}
function iv(f,ms){var id=setInterval(f,ms);TIMERS.push(id);return id}
function clearTimers(){for(var i=0;i<TIMERS.length;i++){clearTimeout(TIMERS[i]);clearInterval(TIMERS[i])}TIMERS=[]}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on')},2200)}
function pad2(n){return (n<10?'0':'')+n}

/* ============ الأيقونات ============ */
var I={};
I.back='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
I.snd='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12"/></svg>';
I.mute='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" stroke="none"/><path d="M16 9l6 6M22 9l-6 6"/></svg>';
I.dice='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor" stroke="none"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor" stroke="none"/><circle cx="15.5" cy="8.5" r="1.6" fill="currentColor" stroke="none"/><circle cx="8.5" cy="15.5" r="1.6" fill="currentColor" stroke="none"/></svg>';
I.users='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20c.8-3.4 3.4-5 6.5-5s5.7 1.6 6.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 15c2.6.3 4.6 2 5.3 5"/></svg>';
I.pad='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 8h10M6 11h12M9 8v11M15 8v11"/><rect x="2.5" y="4" width="19" height="17" rx="4.5"/></svg>';
I.crown='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 8l4 4 5-7 5 7 4-4v10H3z"/><circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"/></svg>';
I.ghost='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3a7 7 0 00-7 7v11l2.5-2 2.3 2 2.2-2 2.2 2 2.3-2L19 21V10a7 7 0 00-7-7z"/><circle cx="9.5" cy="11" r="1.2" fill="currentColor" stroke="none"/><circle cx="14.5" cy="11" r="1.2" fill="currentColor" stroke="none"/></svg>';
I.mic='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></svg>';
I.q='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M8.5 9a3.5 3.5 0 116 2.4c-1 1.1-2.5 1.6-2.5 3.6"/><circle cx="12" cy="18.5" r="1.2" fill="currentColor" stroke="none"/></svg>';
I.eye='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
I.skull='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a8 8 0 00-8 8c0 2.8 1.5 5 3.5 6.3V21h9v-3.7C18.5 16 20 13.8 20 11a8 8 0 00-8-8z"/><circle cx="9" cy="11" r="1.6" fill="currentColor" stroke="none"/><circle cx="15" cy="11" r="1.6" fill="currentColor" stroke="none"/></svg>';
I.brush='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l5 5-8.5 8.5a3.5 3.5 0 11-5-5L15 4z"/><path d="M5 20l1.5-4"/></svg>';
I.music='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="17.5" cy="16" r="2.6"/></svg>';
I.swords='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l6 6M21 3l-6 6M3 3v4M3 3h4M21 3v4M21 3h-4M6 15l3 3 6-6 3 3M9 18l-3 3M18 12l3-3"/></svg>';
I.zap='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>';
I.play='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
I.check='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>';
I.brain=I.q;

var AC=null,MUTED=false;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC&&AC.state==='suspended')AC.resume();}catch(e){AC=null}return AC}
function tone(f,d,type,vol,delay){
  if(MUTED)return;var c=ac();if(!c)return;
  try{var t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';o.frequency.value=f;
  g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);}catch(e){}
}
var sfx={
  tap:function(){tone(620,.06,'square',.05)},
  pop:function(){tone(500,.08,'triangle',.13);tone(750,.09,'triangle',.1,.05)},
  good:function(){tone(620,.09,'square',.09);tone(880,.12,'square',.09,.08)},
  bad:function(){tone(180,.2,'sawtooth',.1)},
  tick:function(){tone(950,.04,'square',.04)},
  drum:function(){tone(90,.12,'sine',.2,0);tone(90,.12,'sine',.2,.16);tone(90,.12,'sine',.2,.32)},
  win:function(){tone(523,.15,'square',.1,0);tone(659,.15,'square',.1,.12);tone(784,.15,'square',.1,.24);tone(1047,.25,'square',.1,.36)}
};
function toggleMute(){MUTED=!MUTED;var b=$('#muteb');if(b)b.innerHTML=MUTED?I.mute:I.snd}
function confetti(n){
  try{
    var c=$('#fx'),x=c.getContext('2d');
    c.width=innerWidth;c.height=innerHeight;
    var cols=['#ffc93d','#ff5d5d','#38d3c0','#4ecb71','#ff8f3d','#e86fa4'];
    var ps=[],i;
    for(i=0;i<(n||120);i++)ps.push({x:Math.random()*c.width,y:-20-Math.random()*300,w:6+Math.random()*7,h:4+Math.random()*5,v:2.2+Math.random()*3.6,r:Math.random()*6,vr:(Math.random()-.5)*.25,col:rnd(cols)});
    var t=0;
    function loop(){
      t++;x.clearRect(0,0,c.width,c.height);
      for(var k=0;k<ps.length;k++){
        var p=ps[k];p.y+=p.v;p.r+=p.vr;
        if(p.y>c.height+20){p.y=-15;p.x=Math.random()*c.width}
        x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();
      }
      if(t<260)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height);
    }
    requestAnimationFrame(loop);
  }catch(e){}
}
var P={};
try{P=JSON.parse(localStorage.getItem('shala_p')||'{}')}catch(e){P={}}
function saveP(){try{localStorage.setItem('shala_p',JSON.stringify(P))}catch(e){}}
function pf(n){
  if(!P[n])P[n]={xp:0,wins:0,streak:0,imp:0,trivia:0,draw:0,music:0,likely:0,games:0};
  return P[n];
}
function award(n,xp,st){
  var p=pf(n);p.xp+=xp;p.games=(p.games||0)+1;
  if(st)for(var k in st)p[k]=(p[k]||0)+st[k];
  saveP();
}
function levelOf(p){return Math.floor(p.xp/500)+1}
var PCOLS=['#ffc93d','#ff5d5d','#38d3c0','#4ecb71','#ff8f3d','#e86fa4','#7fd0ff','#f4d06f'];
var S={players:[]};
try{
  var sv=JSON.parse(localStorage.getItem('shala_pl')||'[]');
  if(typeof sv==='object'&&sv.length){
    for(var q0=0;q0<sv.length;q0++)S.players.push({name:String(sv[q0])});
  }
}catch(e){}
function savePl(){try{localStorage.setItem('shala_pl',JSON.stringify(S.players.map(function(p){return p.name})))}catch(e){}}
function pcol(i){return PCOLS[i%PCOLS.length]}
function avHTML(i,cls){
  return '<div class="av '+(cls||'')+'" style="background:'+pcol(i)+'">'+esc(String(S.players[i].name.charAt(0)||'?'))+'</div>';
}
var NAV=[],CURR=null;
function paint(c){
  clearTimers();
  $('#stage').innerHTML='<div class="scr">'+c.html+'</div>';
  if(c.after){try{c.after($('#stage').firstChild)}catch(e){}}
}
function go(maker){
  if(CURR)NAV.push(CURR);
  CURR=maker;
  paint(maker());
}
function back(){
  sfx.tap();
  var m=NAV.pop();
  if(m)paint(m());else tabGames();
}
function hdr(t){
  return '<div class="hdr"><button class="hbtn" data-act="back">'+I.back+'</button><div class="htitle">'+t+'</div><button class="hbtn" data-act="mute" id="muteb">'+(MUTED?I.mute:I.snd)+'</button></div>';
}
var _passNext=null;
function passGo(i,sub,nextFn){
  sfx.drum();
  _passNext=nextFn;
  var c={html:hdr('سلّم الهاتف')+
    '<div class="body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;flex:1">'+
    '<div class="sub center" style="font-size:16px">'+sub+'</div>'+
    avHTML(i,'big')+
    '<div class="big center">'+esc(S.players[i].name)+'</div>'+
    '<button class="btn" style="max-width:300px" data-act="passOk">'+I.check+' أنا '+esc(S.players[i].name)+' — يلا</button>'+
    '</div>'};
  if(CURR)NAV.push(CURR);
  CURR=function(){return c};
  paint(c);
}
var ACTS={};
document.addEventListener('click',function(e){
  var el=null,n=e.target;
  while(n&&n!==document){
    if(n.getAttribute&&n.getAttribute('data-act')){el=n;break}
    n=n.parentNode;
  }
  if(!el)return;
  var fn=ACTS[el.getAttribute('data-act')];
  if(fn)fn(el.getAttribute('data-arg'),el);
});
ACTS.back=function(){back()};
ACTS.mute=function(){toggleMute()};
ACTS.passOk=function(){sfx.pop();if(_passNext)_passNext()};
ACTS.tab=function(a){
  if(a==='games')tabGames();
  else if(a==='crew')tabCrew();
  else if(a==='solo')tabSolo();
  else if(a==='champ')tabChamp();
};
ACTS.addPlayer=function(){
  var i=$('#pn'),v=i.value.trim();
  if(!v)return toast('اكتب الاسم الأول');
  for(var k=0;k<S.players.length;k++)if(S.players[k].name===v)return toast('الاسم موجود');
  if(S.players.length>=10)return toast('الحد الأقصى 10');
  S.players.push({name:v});pf(v);saveP();savePl();
  i.value='';sfx.pop();tabCrew();
};
ACTS.removePlayer=function(a){S.players.splice(parseInt(a,10),1);savePl();tabCrew()};
function tabShell(active,inner){
  paint({html:'<div class="scr">'+
  '<div class="hdr"><div class="htitle"><span style="color:var(--yl);font-size:16px">FAWDA</span></div><button class="hbtn" data-act="mute" id="muteb">'+(MUTED?I.mute:I.snd)+'</button></div>'+
  '<div class="body">'+inner+'</div>'+
  '<div class="tabbar">'+
  '<div class="tab '+(active==='games'?'on':'')+'" data-act="tab" data-arg="games">'+I.dice+'<span>الألعاب</span></div>'+
  '<div class="tab '+(active==='crew'?'on':'')+'" data-act="tab" data-arg="crew">'+I.users+'<span>شلّتك</span></div>'+
  '<div class="tab '+(active==='solo'?'on':'')+'" data-act="tab" data-arg="solo">'+I.pad+'<span>لوحدي</span></div>'+
  '<div class="tab '+(active==='champ'?'on':'')+'" data-act="tab" data-arg="champ">'+I.crown+'<span>البطولة</span></div>'+
  '</div></div>'});
  NAV=[];
}
function tabGames(){
  sfx.pop();
  if(typeof GAMES_READY==='undefined'){

    inner='<div class="wordcard"><div class="sub" style="font-weight:800">الكلمة السرية</div><div class="w">'+esc(F.blindWord)+'</div></div>';

ACTS.impRevealF=function(){
  sfx.drum();
  var F=IM.F,n=S.players.length;
  var cnt=[];
  for(var i=0;i<n;i++)cnt.push(0);
  for(var k in F.votes)cnt[F.votes[k]]++;
  var order=[];
  for(var j=0;j<n;j++)order.push(j);
  order.sort(function(a,b){return cnt[b]-cnt[a]});
  var twoMode=F.mode==='double'||F.mode==='secret';
  var caught=0;
  if(twoMode){
    if(F.imps.indexOf(order[0])>=0)caught++;
    if(F.imps.indexOf(order[1])>=0)caught++;
  }else if(F.imps.indexOf(order[0])>=0)caught=1;
  var civWin=caught>0&&(caught===F.imps.length||!twoMode);
  var maxc=1;
  for(var m=0;m<n;m++)if(cnt[m]>maxc)maxc=cnt[m];
  var bars='';
  for(var q=0;q<n;q++)bars+='<div class="mt"><div style="display:flex;justify-content:space-between"><b>'+esc(S.players[q].name)+'</b><span>'+cnt[q]+'</span></div><div class="bar"><div style="width:'+Math.max(10,cnt[q]/maxc*100)+'%;background:'+(F.imps.indexOf(q)>=0?'var(--red)':'var(--yl)')+'">'+cnt[q]+'</div></div></div>';
  var impNames='';
  for(var w=0;w<F.imps.length;w++){
    if(w>0)impNames+=' + ';
    impNames+=esc(S.players[F.imps[w]].name);
  }
  go(function(){
    return {html:hdr('النتيجة')+'<div class="body">'+
    '<div class="wordcard '+(civWin?'':'red')+'">'+
    '<div class="sub" style="color:'+(civWin?'var(--gr)':'var(--red)')+'">'+(civWin?'الشلة كشفت الـ Imposter!':'الـ Imposter نجا!')+'</div>'+
    '<div class="w" style="font-size:26px">'+impNames+'</div>'+
    '<div class="sub mt">الكلمة كانت: <b style="color:var(--yl)">'+esc(F.word)+'</b></div></div>'+
    '<div class="card mt"><b>الأصوات:</b>'+bars+'</div>'+
    '<button class="btn mt2" data-act="impAward" data-arg="'+(civWin?1:0)+'">'+I.crown+' وزّعوا النقاط — جولة جديدة</button></div>'};
  });
  if(civWin){confetti(120);sfx.win()}else sfx.bad();
};
ACTS.impAward=function(a){
  var civWin=a==='1';
  var F=IM.F;
  for(var i=0;i<S.players.length;i++){
    var isImp=F.imps.indexOf(i)>=0;
    if(isImp)award(S.players[i].name,civWin?25:150,{imp:civWin?0:1,wins:civWin?0:1});
    else award(S.players[i].name,civWin?60:15,{wins:civWin?1:0});
  }
  saveP();sfx.good();
  if(IM.champ&&CH.active){
    for(var j=0;j<S.players.length;j++){
      var isImp2=F.imps.indexOf(j)>=0;
      if(isImp2)CH.scores[S.players[j].name]+=(civWin?25:150);
      else CH.scores[S.players[j].name]+=(civWin?60:15);
    }
    IM.champ=false;
    champStandings(1);
  }else impSetup();
};

  for(var i=0;i<S.players.length;i++)btns+='<div class="grow" data-act="arPickA" data-arg="'+i+'">'+avHTML(i)+'<div class="gt">'+esc(S.players[i].name)+'</div></div>';
  go(function(){
    return {html:hdr('1 VS 1 ARENA')+'<div class="body">'+
    '<div class="big">اختار اللاعب الأول</div><div class="mt">'+btns+'</div></div>'};
  });
}
ACTS.arPickA=function(a){
  AR.a=parseInt(a,10);sfx.tap();
  var btns='';
  for(var j=0;j<S.players.length;j++){
    if(j===AR.a)continue;
    btns+='<div class="grow" data-act="arPickB" data-arg="'+j+'">'+avHTML(j)+'<div class="gt">'+esc(S.players[j].name)+'</div></div>';
  }
  go(function(){
    return {html:hdr('اختار الخصم')+'<div class="body"><div class="big">مين ضده؟</div><div class="mt">'+btns+'</div></div>'};
  });
};
ACTS.arPickB=function(a){
  AR.b=parseInt(a,10);
  AR.qs=shuffle(TRIVIA).slice(0,8);AR.i=0;AR.sa=0;AR.sb=0;AR.turn=0;
  sfx.pop();arTurn();
};
function arTurn(){
  if(AR.i>=AR.qs.length)return arEnd();
  var cur=AR.turn===0?AR.a:AR.b;
  var q=AR.qs[AR.i];
  passGo(cur,'سؤال لك — ركّز!',function(){
    var opts='';
    for(var o=0;o<4;o++)opts+='<button class="btn ghost sm mt" data-act="arAns" data-arg="'+o+'">'+esc(q[1][o])+'</button>';
    go(function(){
      return {html:hdr('دور '+esc(S.players[cur].name))+'<div class="body">'+
      '<div class="score-pill"><span>'+esc(S.players[AR.a].name)+' '+AR.sa+'</span><span>'+AR.sb+' '+esc(S.players[AR.b].name)+'</span></div>'+
      '<div class="wordcard mt"><div class="w" style="font-size:22px">'+esc(q[0])+'</div></div>'+opts+'</div>'};
    });
  });
}
ACTS.arAns=function(a){
  var q=AR.qs[AR.i];
  var ok=parseInt(a,10)===q[2];
  if(AR.turn===0){if(ok)AR.sa+=10;else AR.sb+=5}
  else{if(ok)AR.sb+=10;else AR.sa+=5}
  if(ok){sfx.good();toast('صح!')}else{sfx.bad();toast('غلط — الإجابة: '+q[1][q[2]])}
  AR.i++;AR.turn=1-AR.turn;
  tm(arTurn,900);
};
function arEnd(){
  var win=AR.sa===AR.sb?-1:(AR.sa>AR.sb?AR.a:AR.b);
  go(function(){
    return {html:hdr('النتيجة')+'<div class="body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">'+
    '<div class="score-pill" style="width:100%"><span>'+esc(S.players[AR.a].name)+' '+AR.sa+'</span><span>'+AR.sb+' '+esc(S.players[AR.b].name)+'</span></div>'+
    (win>=0?'<div class="big center">'+(win===AR.a?esc(S.players[AR.a].name):esc(S.players[AR.b].name))+' كسب!</div>':'<div class="big center">تعادل!</div>')+
    '<button class="btn mt" data-act="arAgain">جولة كمان</button>'+
    '<button class="btn ghost" data-act="tab" data-arg="games">ارجعوا للألعاب</button></div>'};
  });
  if(win>=0){award(S.players[win].name,60,{wins:1});saveP();confetti(100);sfx.win()}else sfx.good();
}
ACTS.arAgain=function(){sfx.pop();arMenu()};

/* ===== TEAM BATTLE ===== */
var TE={t1:[],t2:[],s1:0,s2:0,qs:[],i:0,turn:0};
function teSetup(){
  go(function(){
    return {html:hdr('TEAM BATTLE')+'<div class="body" style="display:flex;flex-direction:column;gap:12px">'+
    '<button class="btn" data-act="teSplit">'+I.users+' قسموا الشلة عشوائي</button>'+
    '<div id="teinfo" class="sub center">مفيش تقسيم لسه</div>'+
    '<button class="btn gr" id="tego" disabled data-act="teStart">'+I.swords+' ابدأوا المعركة</button></div>'};
  });
}
ACTS.teSplit=function(){
  if(S.players.length<4)return toast('محتاجين 4 لاعبين على الأقل');
  var idxs=[];
  for(var i=0;i<S.players.length;i++)idxs.push(i);
  idxs=shuffle(idxs);
  TE.t1=[];TE.t2=[];
  for(var j=0;j<idxs.length;j++){if(j%2===0)TE.t1.push(idxs[j]);else TE.t2.push(idxs[j])}
  var n1='',n2='';
  for(var a=0;a<TE.t1.length;a++)n1+=esc(S.players[TE.t1[a]].name)+' • ';
  for(var b=0;b<TE.t2.length;b++)n2+=esc(S.players[TE.t2[b]].name)+' • ';
  $('#teinfo').innerHTML='<b style="color:var(--yl)">فريق A:</b> '+n1+'<br><b style="color:var(--tl)">فريق B:</b> '+n2;
  $('#tego').disabled=false;
  sfx.pop();
};
ACTS.teStart=function(){TE.qs=shuffle(TRIVIA).slice(0,12);TE.i=0;TE.s1=0;TE.s2=0;TE.turn=0;teTurn()};
function teTurn(){
  if(TE.i>=TE.qs.length)return teEnd();
  var t=TE.turn===0?TE.t1:TE.t2;
  var cur=t[TE.i%t.length];
  var q=TE.qs[TE.i];
  passGo(cur,'جاوب لفريقك!',function(){
    var opts='';
    for(var o=0;o<4;o++)opts+='<button class="btn ghost sm mt" data-act="teAns" data-arg="'+o+'">'+esc(q[1][o])+'</button>';
    go(function(){
      return {html:hdr(TE.turn===0?'فريق A':'فريق B')+'<div class="body">'+
      '<div class="score-pill"><span>A: '+TE.s1+'</span><span>B: '+TE.s2+'</span></div>'+
      '<div class="wordcard mt"><div class="w" style="font-size:22px">'+esc(q[0])+'</div></div>'+opts+'</div>'};
    });
  });
}
ACTS.teAns=function(a){
  var q=TE.qs[TE.i];
  var ok=parseInt(a,10)===q[2];
  if(ok){if(TE.turn===0)TE.s1+=10;else TE.s2+=10;sfx.good()}
  else{sfx.bad();toast('غلط! الإجابة: '+q[1][q[2]])}
  TE.i++;TE.turn=1-TE.turn;tm(teTurn,900);
};
function teEnd(){
  var w=TE.s1===TE.s2?0:(TE.s1>TE.s2?1:2);
  go(function(){
    return {html:hdr('النتيجة')+'<div class="body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">'+
    '<div class="score-pill" style="width:100%"><span>فريق A: '+TE.s1+'</span><span>فريق B: '+TE.s2+'</span></div>'+
    '<div class="big center">'+(w===0?'تعادل!':(w===1?'فريق A كسب!':'فريق B كسب!'))+'</div>'+
    '<button class="btn" data-act="tab" data-arg="games">'+I.back+' ارجعوا للألعاب</button></div>'};
  });
  if(w>0){
    var winners=w===1?TE.t1:TE.t2;
    for(var i=0;i<winners.length;i++)award(S.players[winners[i]].name,50,{wins:1});
    saveP();confetti(120);sfx.win();
  }else sfx.good();
}

/* ===== SOLO GAMES ===== */
function lvlGet(g){var l={};try{l=JSON.parse(localStorage.getItem('shala_lvl')||'{}')}catch(e){}return l[g]||1}
function lvlSet(g,v){var l={};try{l=JSON.parse(localStorage.getItem('shala_lvl')||'{}')}catch(e){}l[g]=v;try{localStorage.setItem('shala_lvl',JSON.stringify(l))}catch(e){}}
function soloEnd(g,won){
  if(won){
    var lv=lvlGet(g);
    if(lv<10)lvlSet(g,lv+1);
    confetti(70);sfx.win();
    var done=Math.min(lv,10);
    go(function(){
      return {html:hdr('SOLO')+'<div class="body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">'+
      '<div class="wordcard"><div class="sub" style="color:var(--gr);font-weight:800">مبروك!</div><div class="w" style="font-size:24px">خلصت المستوى '+done+'</div></div>'+
      '<button class="btn" data-act="tab" data-arg="solo">ارجع للألعاب الفردية</button></div>'};
    });
  }else{
    sfx.bad();
    go(function(){
      return {html:hdr('SOLO')+'<div class="body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">'+
      '<div class="wordcard red"><div class="sub" style="color:var(--red);font-weight:800">حاول تاني</div><div class="w" style="font-size:24px">مش مظبوطة المرة دي</div></div>'+
      '<button class="btn" data-act="tab" data-arg="solo">ارجع للألعاب الفردية</button></div>'};
    });
  }
}
ACTS.soloGo=function(a){
  if(a==='reaction')soReaction();
  else if(a==='numbers')soNumbers();
  else if(a==='cards')soCards();
  else if(a==='pattern')soPattern();
  else if(a==='aim')soAim();
  else if(a==='puzzle')soPuzzle();
};
function soReaction(){
  var lv=lvlGet('reaction');
  var need=Math.max(170,540-lv*30);
  go(function(){
    return {html:hdr('REACTION — مستوى '+lv+'/10')+'<div class="body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">'+
    '<div id="rb" class="wordcard" style="width:100%;cursor:pointer;min-height:150px;display:flex;flex-direction:column;justify-content:center"><div class="w" id="rt" style="font-size:26px">دوس عشان تبدأ</div><div class="sub mt">لازم ترد في أقل من '+need+'ms</div></div></div>'};
  });
  tm(function(){
    var box=$('#rb');if(!box)return;
    var txt=$('#rt');
    var st=0,t0=0,to=null;
    box.addEventListener('click',function(){
      if(st===0){
        st=1;txt.textContent='استنى الأخضر...';txt.style.color='var(--red)';
        to=tm(function(){st=2;t0=Date.now();txt.textContent='ادوس!';txt.style.color='var(--gr)'},800+Math.random()*2600);
      }else if(st===1){
        clearTimeout(to);st=0;txt.textContent='طردت! دوس تاني';txt.style.color='var(--red)';sfx.bad();
      }else if(st===2){
        var ms=Date.now()-t0;st=0;
        if(ms<=need){soloEnd('reaction',true)}
        else{txt.textContent=ms+'ms — بطيء! دوس تاني';txt.style.color='var(--red)';sfx.bad()}
      }
    });
  },60);
}
function soNumbers(){
  var lv=lvlGet('numbers');
  var N=6+lv*2,tLimit=10+lv;
  var nums=[];
  for(var i=1;i<=N;i++)nums.push(i);
  nums=shuffle(nums);
  var cells='';
  for(var k=0;k<N;k++)cells+='<button class="chip" style="width:30%;margin:1%;min-height:60px;font-size:22px" data-num="'+nums[k]+'">'+nums[k]+'</button>';
  go(function(){
    return {html:hdr('NUMBER RUSH — مستوى '+lv+'/10')+'<div class="body">'+
    '<div class="score-pill"><span>ادوس من 1 لـ '+N+'</span><span id="nt">'+tLimit+'s</span></div>'+
    '<div style="display:flex;flex-wrap:wrap" id="ngrid">'+cells+'</div></div>'};
  });
  var next=1,t=tLimit;
  iv(function(){
    t--;var el=$('#nt');if(el)el.textContent=t+'s';
    if(t<=0){soloEnd('numbers',false)}
  },1000);
  $('#ngrid').addEventListener('click',function(e){
    var b=e.target.getAttribute?e.target.getAttribute('data-num'):null;
    if(b===null)return;
    var n=parseInt(b,10);
    if(n===next){
      e.target.style.visibility='hidden';sfx.tick();next++;
      if(next>N)soloEnd('numbers',true);
    }else{sfx.bad();t=Math.max(0,t-2)}
  });
}
function soCards(){
  var lv=lvlGet('cards');
  var pairs=3+lv;
  var em=['🍎','🍌','🍇','🍓','🥕','🌽','🍕','🍩','⚽','🏀','🚗','✈️','🐱','🐶','⭐','🌙','🔥','💧'];
  var pick=shuffle(em).slice(0,pairs);
  var deck=shuffle(pick.concat(pick));
  var cells='';
  for(var i=0;i<deck.length;i++)cells+='<button class="chip" style="width:28%;margin:1%;font-size:24px;min-height:60px" data-ci="'+i+'">؟</button>';
  go(function(){
    return {html:hdr('MEMORY CARDS — مستوى '+lv+'/10')+'<div class="body center">'+
    '<div class="sub">طابق كل الأزواج</div>'+
    '<div style="display:flex;flex-wrap:wrap;justify-content:center" id="cgrid">'+cells+'</div></div>'};
  });
  var open=[],found=0,busy=false;
  $('#cgrid').addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('[data-ci]'):null;
    if(!b||busy)return;
    var i=parseInt(b.getAttribute('data-ci'),10);
    if(b.textContent!=='؟')return;
    b.textContent=deck[i];sfx.tick();
    open.push({i:i,b:b});
    if(open.length===2){
      busy=true;
      var A=open[0],B=open[1];
      if(deck[A.i]===deck[B.i]){
        found++;open=[];busy=false;sfx.good();
        if(found>=pairs)tm(function(){soloEnd('cards',true)},400);
      }else{
        tm(function(){A.b.textContent='؟';B.b.textContent='؟';open=[];busy=false;sfx.bad()},700);
      }
    }
  });
}
function soPattern(){
  var lv=lvlGet('pattern');
  var len=3+lv;
  var cols=['#ffc93d','#ff5d5d','#38d3c0','#4ecb71','#e86fa4'];
  var seq=[];
  for(var i=0;i<len;i++)seq.push(Math.floor(Math.random()*5));
  var pads='';
  for(var p=0;p<5;p++)pads+='<button class="chip" data-pi="'+p+'" style="width:30%;margin:1%;min-height:80px;background:'+cols[p]+';border-color:#1a1408"></button>';
  go(function(){
    return {html:hdr('PATTERN — مستوى '+lv+'/10')+'<div class="body center">'+
    '<div id="pmsg" class="sub">احفظ النمط...</div>'+
    '<div class="wordcard mt" style="min-height:80px"><div class="w" id="ptxt" style="font-size:40px">●</div></div>'+
    '<div style="display:flex;flex-wrap:wrap;justify-content:center" id="pgrid">'+pads+'</div></div>'};
  });
  tm(function(){
    var idx=0;
    var el=$('#ptxt'),msg=$('#pmsg');
    var pl=iv(function(){
      el.textContent=(idx+1)+'/'+len;
      el.style.color=cols[seq[idx]];
      sfx.tick();
      idx++;
      if(idx>=len){
        clearInterval(pl);
        msg.textContent='دلوقتي كرروا النمط';
        el.textContent='؟';el.style.color='var(--yl)';
        var pos=0;
        $('#pgrid').addEventListener('click',function(e){
          var b=e.target.closest?e.target.closest('[data-pi]'):null;
          if(!b)return;
          var pi=parseInt(b.getAttribute('data-pi'),10);
          if(pi===seq[pos]){pos++;sfx.tick();if(pos>=len)soloEnd('pattern',true)}
          else soloEnd('pattern',false);
        });
      }
    },900);
  },600);
}
function soAim(){
  var lv=lvlGet('aim');
  var total=5+lv*2,tLimit=8+lv;
  go(function(){
    return {html:hdr('AIM — مستوى '+lv+'/10')+'<div class="body center">'+
    '<div class="score-pill"><span id="at">0/'+total+'</span><span id="ac">'+tLimit+'s</span></div>'+
    '<div id="abox" class="card mt" style="position:relative;height:380px;overflow:hidden"></div></div>'};
  });
  var hits=0,t=tLimit;
  var box=$('#abox');
  function spawn(){
    var b=document.createElement('button');
    b.style.cssText='position:absolute;width:52px;height:52px;border-radius:50%;border:3px solid #1a1408;background:var(--red);cursor:pointer';
    b.style.left=(Math.random()*Math.max(10,box.clientWidth-60))+'px';
    b.style.top=(Math.random()*Math.max(10,box.clientHeight-60))+'px';
    b.onclick=function(e){
      e.stopPropagation();
      hits++;sfx.tick();
      $('#at').textContent=hits+'/'+total;
      b.remove();
      if(hits>=total)soloEnd('aim',true);
      else spawn();
    };
    box.appendChild(b);
  }
  spawn();
  iv(function(){
    t--;var el=$('#ac');if(el)el.textContent=t+'s';
    if(t<=0)soloEnd('aim',false);
  },1000);
}
function soPuzzle(){
  var lv=lvlGet('puzzle');
  var N=3,tiles=[];
  for(var i=0;i<8;i++)tiles.push(i+1);
  tiles.push(0);
  for(var s=0;s<200;s++){
    var z=tiles.indexOf(0);
    var opts=[];
    var r=Math.floor(z/N),c=z%N;
    if(r>0)opts.push(z-N);
    if(r<N-1)opts.push(z+N);
    if(c>0)opts.push(z-1);
    if(c<N-1)opts.push(z+1);
    var sw=opts[Math.floor(Math.random()*opts.length)];
    tiles[z]=tiles[sw];tiles[sw]=0;
  }
  var moves=0,limit=60+lv*10;
  function draw(){
    var g='';
    for(var k=0;k<9;k++){
      if(tiles[k]===0)g+='<div style="width:31%;margin:1%;min-height:80px"></div>';
      else g+='<button class="chip" data-ti="'+k+'" style="width:31%;margin:1%;min-height:80px;font-size:26px;background:var(--yl);color:#221a08;border-color:#1a1408">'+tiles[k]+'</button>';
    }
    $('#pgrid').innerHTML=g;
    $('#pmsg').textContent='حركات: '+moves+' / '+limit;
  }
  go(function(){
    return {html:hdr('PUZZLE — مستوى '+lv+'/10')+'<div class="body center">'+
    '<div id="pmsg" class="sub">رتّب المربعات من 1 لـ 8</div>'+
    '<div style="display:flex;flex-wrap:wrap" id="pgrid"></div></div>'};
  });
  tm(function(){
    draw();
    $('#pgrid').addEventListener('click',function(e){
      var b=e.target.closest?e.target.closest('[data-ti]'):null;
      if(!b)return;
      var k=parseInt(b.getAttribute('data-ti'),10);
      var z=tiles.indexOf(0);
      var r=Math.floor(z/N),c=z%N,ok=false;
      if(k===z-N||k===z+N||(k===z-1&&c>0)||(k===z+1&&c<N-1))ok=true;
      if(ok){
        tiles[z]=tiles[k];tiles[k]=0;moves++;sfx.tick();draw();
        var win=true;
        for(var m=0;m<8;m++)if(tiles[m]!==m+1)win=false;
        if(win)soloEnd('puzzle',true);
        else if(moves>=limit)soloEnd('puzzle',false);
      }
    });
  },60);
}

/* ===== CHAMPIONSHIP ===== */
var CH={active:false,scores:{},round:0};
var CHROUNDS=['IMPOSTER','TRIVIA','REACTION','MOST LIKELY','SECRET MISSION','NUMBER RUSH','FINAL 1v1'];
ACTS.chStart=function(){
  if(S.players.length<3)return toast('محتاجين 3 لاعبين');
  CH.active=true;CH.round=0;CH.scores={};
  for(var i=0;i<S.players.length;i++)CH.scores[S.players[i].name]=0;
  IM.champ=true;
  sfx.drum();
  toast('الجولة 1: IMPOSTER');
  impSetup();
};
function champStandings(r){
  CH.round=r;
  if(r>=CHROUNDS.length){champPodium(-1);return}
  var arr=[];
  for(var i=0;i<S.players.length;i++)arr.push({n:S.players[i].name,s:CH.scores[S.players[i].name]||0});
  arr.sort(function(a,b){return b.s-a.s});
  var rows='';
  for(var j=0;j<arr.length;j++)rows+='<div class="score-pill" style="width:100%"><span>'+(j+1)+'. '+esc(arr[j].n)+'</span><span>'+arr[j].s+'</span></div>';
  go(function(){
    return {html:hdr('البطولة — الترتيب')+'<div class="body" style="display:flex;flex-direction:column;align-items:center;gap:8px">'+
    '<div class="big center">خلصت الجولة '+r+' من 7</div>'+rows+
    '<button class="btn mt2" data-act="chNext" data-arg="'+r+'">'+I.crown+' الجولة '+(r+1)+': '+CHROUNDS[r]+'</button></div>'};
  });
  confetti(40);
}
ACTS.chNext=function(a){
  var r=parseInt(a,10);
  sfx.pop();
  var fns=[null,chTrivia,chReaction,chLikely,chMission,chRush,chDuel];
  if(fns[r])fns[r]();
};
var CHT={i:0,qs:[]};
function chTrivia(){
  CHT.i=0;CHT.qs=shuffle(TRIVIA).slice(0,S.players.length);
  chTTurn();
}
function chTTurn(){
  if(CHT.i>=CHT.qs.length)return champStandings(CH.round+1);
  var pi=CHT.i%S.players.length;
  var q=CHT.qs[CHT.i];
  passGo(pi,'سؤال معلومات — الإجابة الصح = 30 نقطة',function(){
    var order=shuffle([0,1,2,3]);
    var opts='';
    for(var oi=0;oi<order.length;oi++){
      var idx=order[oi];
      opts+='<button class="btn ghost sm mt" data-act="chTAns" data-arg="'+(idx===q[2]?1:0)+'">'+esc(q[1][idx])+'</button>';
    }
    go(function(){
      return {html:hdr('TRIVIA — '+esc(S.players[pi].name))+'<div class="body" style="display:flex;flex-direction:column;justify-content:center;gap:12px">'+
      avHTML(pi)+'<div class="wordcard mt"><div class="w" style="font-size:22px">'+esc(q[0])+'</div></div>'+opts+'</div>'};
    });
  });
}
ACTS.chTAns=function(a){
  var pi=CHT.i%S.players.length;
  if(a==='1'){CH.scores[S.players[pi].name]+=30;sfx.good();confetti(30)}
  else sfx.bad();
  CHT.i++;tm(chTTurn,800);
};
var CHR={i:0,times:[]};
function chReaction(){CHR.i=0;CHR.times=[];chRTurn()}
function chRTurn(){
  if(CHR.i>=S.players.length)return chRResults();
  var pi=CHR.i;
  passGo(pi,'استنى الأخضر وادوس بأسرع وقت',function(){
    go(function(){
      return {html:hdr('REACTION — '+esc(S.players[pi].name))+'<div class="body" style="display:flex;flex-direction:column;justify-content:center">'+
      '<div id="rb2" class="wordcard" style="cursor:pointer;min-height:170px;display:flex;flex-direction:column;justify-content:center"><div class="w" id="rt2" style="font-size:26px">دوس عشان تبدأ</div></div></div>'};
    });
    tm(function(){
      var box=$('#rb2');if(!box)return;
      var txt=$('#rt2');
      var st=0,t0=0,to=null;
      box.addEventListener('click',function(){
        if(st===0){
          st=1;txt.textContent='استنى...';txt.style.color='var(--red)';
          to=tm(function(){st=2;t0=Date.now();txt.textContent='ادوس!';txt.style.color='var(--gr)'},800+Math.random()*2200);
        }else if(st===1){
          clearTimeout(to);st=3;
          CHR.times[pi]=9999;CHR.i++;
          txt.textContent='طردت! صفر نقاط';txt.style.color='var(--red)';sfx.bad();
          tm(chRTurn,1000);
        }else if(st===2){
          var ms=Date.now()-t0;st=3;
          CHR.times[pi]=ms;
          txt.textContent=ms+'ms';
          if(ms<300){CH.scores[S.players[pi].name]+=50;sfx.win()}
          else if(ms<500){CH.scores[S.players[pi].name]+=30;sfx.good()}
          else{CH.scores[S.players[pi].name]+=10;sfx.tap()}
          CHR.i++;
          tm(chRTurn,1200);
        }
      });
    },60);
  });
}
function chRResults(){
  var arr=[];
  for(var i=0;i<S.players.length;i++)arr.push({i:i,t:CHR.times[i]||9999});
  arr.sort(function(a,b){return a.t-b.t});
  if(arr[0]&&arr[0].t<9999)CH.scores[S.players[arr[0].i].name]+=30;
  champStandings(CH.round+1);
}
var CHL={q:'',votes:{}};
function chLikely(){
  CHL.q=rnd(LIKELY);CHL.votes={};
  go(function(){
    return {html:hdr('MOST LIKELY')+'<div class="body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">'+
    '<div class="wordcard"><div class="w" style="font-size:22px">'+esc(CHL.q)+'</div></div>'+
    '<button class="btn" data-act="chLVote">'+I.q+' اتفقتم؟ يلا نصوّت</button></div>'};
  });
}
ACTS.chLVote=function(){chLCast(0)};
function chLCast(i){
  if(i>=S.players.length)return chLResult();
  passGo(i,'صوّت على مين يستاهل اللقب',function(){
    var btns='';
    for(var j=0;j<S.players.length;j++){
      if(j===i)continue;
      btns+='<div class="grow" data-act="chLCast2" data-arg="'+i+':'+j+'">'+avHTML(j)+'<div class="gt">'+esc(S.players[j].name)+'</div></div>';
    }
    go(function(){
      return {html:hdr('التصويت')+'<div class="body">'+avHTML(i)+'<div class="big center mt">'+esc(S.players[i].name)+' — صوتك؟</div><div class="mt">'+btns+'</div></div>'};
    });
  });
}
ACTS.chLCast2=function(a){
  var p=a.split(':');
  var v=parseInt(p[1],10);
  CHL.votes[v]=(CHL.votes[v]||0)+1;
  sfx.pop();chLCast(parseInt(p[0],10)+1);
};
function chLResult(){
  var win=null,mx=-1;
  for(var k in CHL.votes)if(CHL.votes[k]>mx){mx=CHL.votes[k];win=parseInt(k,10)}
  if(win!==null)CH.scores[S.players[win].name]+=60;
  go(function(){
    return {html:hdr('النتيجة')+'<div class="body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px">'+
    '<div class="sub center">'+esc(CHL.q)+'</div>'+
    (win!==null?avHTML(win,'big'):'<div class="big">محدا صوّت!</div>')+
    (win!==null?'<div class="big center">'+esc(S.players[win].name)+' +60</div>':'')+
    '</div>'};
  });
  if(win!==null){confetti(60);sfx.win()}
  tm(function(){champStandings(CH.round+1)},1800);
}
function chMission(){
  function rev(i){
    if(i>=S.players.length)return champStandings(CH.round+1);
    passGo(i,'مهمتك السرية للجولة دي',function(){
      var m=MISSIONS[(i+3)%MISSIONS.length].replace('{p}',S.players[(i+1)%S.players.length].name).replace('{w}',rnd(WWORDS));
      go(function(){
        return {html:hdr('المهمة')+'<div class="body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">'+
        avHTML(i)+
        '<div class="wordcard"><div class="w" style="font-size:20px">'+esc(m)+'</div></div>'+
        '<div class="row" style="width:100%"><button class="btn gr" data-act="chMDone" data-arg="'+i+'">نفذتها +30</button><button class="btn ghost" data-act="chMFail" data-arg="'+i+'">معرفتش</button></div></div>'};
      });
    });
  }
  ACTS.chMDone=function(a){var i2=parseInt(a,10);CH.scores[S.players[i2].name]+=30;sfx.good();rev(i2+1)};
  ACTS.chMFail=function(a){sfx.tap();rev(parseInt(a,10)+1)};
  rev(0);
}
var CHN={i:0,results:[]};
function chRush(){
  CHN.i=0;CHN.results=[];
  chNTurn();
}
function chNTurn(){
  if(CHN.i>=S.players.length){
    var best=-1,bt=99999;
    for(var r=0;r<S.players.length;r++){
      var tt=CHN.results[r]||99999;
      if(tt<bt){bt=tt;best=r}
    }
    if(best>=0&&bt<99999)CH.scores[S.players[best].name]+=40;
    return champStandings(CH.round+1);
  }
  var pi=CHN.i;
  passGo(pi,'ادوس الأرقام بالترتيب بأسرع وقت — الأسرع ياخد +40 زيادة',function(){
    var N=8;
    var nums=[];
    for(var i=1;i<=N;i++)nums.push(i);
    nums=shuffle(nums);
    var cells='';
    for(var k=0;k<N;k++)cells+='<button class="chip" style="width:30%;margin:1%;min-height:64px;font-size:22px" data-cn="'+nums[k]+'">'+nums[k]+'</button>';
    go(function(){
      return {html:hdr('NUMBER RUSH — '+esc(S.players[pi].name))+'<div class="body center">'+
      '<div class="sub">من 1 لـ '+N+'</div><div style="display:flex;flex-wrap:wrap" id="cgrid">'+cells+'</div></div>'};
    });
    var next=1,t0=0;
    $('#cgrid').addEventListener('click',function(e){
      var b=e.target.closest?e.target.closest('[data-cn]'):null;
      if(!b)return;
      var n=parseInt(b.getAttribute('data-cn'),10);
      if(n===next){
        if(next===1)t0=Date.now();
        b.style.visibility='hidden';sfx.tick();next++;
        if(next>N){
          var sec=(Date.now()-t0)/1000;
          var pts=Math.max(10,Math.round(60-sec*3));
          CH.scores[S.players[pi].name]+=pts;
          CHN.results[pi]=sec;
          toast(sec.toFixed(1)+' ثانية — +'+pts+' نقطة');
          CHN.i++;tm(chNTurn,1200);
        }
      }else sfx.bad();
    });
  });
}
var CD={A:0,B:0,AS:0,BS:0,qs:[],i:0,turn:0};
function chDuel(){
  var arr=[];
  for(var i=0;i<S.players.length;i++)arr.push({i:i,s:CH.scores[S.players[i].name]||0});
  arr.sort(function(a,b){return b.s-a.s});
  CD.A=arr[0].i;CD.B=arr[1].i;
  CD.qs=shuffle(TRIVIA).slice(0,6);CD.i=0;CD.turn=0;CD.AS=0;CD.BS=0;
  sfx.drum();
  toast('الفاينل: '+S.players[CD.A].name+' ضد '+S.players[CD.B].name);
  cdTurn();
}
function cdTurn(){
  if(CD.i>=CD.qs.length)return cdEnd();
  var cur=CD.turn===0?CD.A:CD.B;
  var q=CD.qs[CD.i];
  passGo(cur,'سؤال الفاينل!',function(){
    var order=shuffle([0,1,2,3]);
    var opts='';
    for(var oi=0;oi<order.length;oi++){
      var idx=order[oi];
      opts+='<button class="btn ghost sm mt" data-act="cdAns" data-arg="'+(idx===q[2]?1:0)+'">'+esc(q[1][idx])+'</button>';
    }
    go(function(){
      return {html:hdr('الفاينل — '+esc(S.players[cur].name))+'<div class="body">'+
      '<div class="wordcard"><div class="w" style="font-size:22px">'+esc(q[0])+'</div></div>'+opts+'</div>'};
    });
  });
}
ACTS.cdAns=function(a){
  if(a==='1'){
    if(CD.turn===0)CD.AS++;else CD.BS++;
    sfx.good();
  }else sfx.bad();
  CD.i++;CD.turn=1-CD.turn;
  tm(cdTurn,700);
};
function cdEnd(){
  var w=CD.AS===CD.BS?-1:(CD.AS>CD.BS?CD.A:CD.B);
  if(w>=0)CH.scores[S.players[w].name]+=100;
  champPodium(w);
}
function champPodium(w){
  CH.active=false;IM.champ=false;
  var arr=[];
  for(var i=0;i<S.players.length;i++)arr.push({n:S.players[i].name,s:CH.scores[S.players[i].name]||0});
  arr.sort(function(a,b){return b.s-a.s});
  var rows='';
  for(var j=0;j<arr.length;j++)rows+='<div class="score-pill" style="width:100%"><span>'+(j+1)+'. '+esc(arr[j].n)+'</span><span>'+arr[j].s+'</span></div>';
  var head=w>=0?esc(S.players[w].name)+' كسب البطولة!':'الفاينل خلص';
  go(function(){
    return {html:hdr('بطل البطولة')+'<div class="body" style="display:flex;flex-direction:column;align-items:center;gap:12px">'+
    '<div class="gic" style="background:var(--yl);width:90px;height:90px">'+I.crown+'</div>'+
    '<div class="big center">'+head+'</div>'+rows+
    '<button class="btn mt2" data-act="tab" data-arg="games">'+I.back+' ارجعوا للألعاب</button></div>'};
  });
  if(w>=0){
    award(S.players[w].name,200,{wins:1});
    for(var p=0;p<S.players.length;p++){
      var nm=S.players[p].name;
      if(nm!==S.players[w].name)award(nm,Math.round((CH.scores[nm]||0)/2),{});
    }
    saveP();confetti(200);sfx.win();
  }
}

/* ===== زر اللعب العشوائي ===== */
ACTS.rdGo=function(){
  if(S.players.length<2)return toast('ضيفوا لاعبين الأول');
  sfx.drum();
  var pool=['impSetup','amSetup','lkSetup','msSetup','lySetup','dwSetup','muSetup','arMenu','teSetup'];
  var names={impSetup:'IMPOSTER',amSetup:'ASK ME',lkSetup:'MOST LIKELY',msSetup:'SECRET MISSION',lySetup:'WHO IS LYING',dwSetup:'DRAW and GUESS',muSetup:'MUSIC BATTLE',arMenu:'1 VS 1 ARENA',teSetup:'TEAM BATTLE'};
  var pick=rnd(pool);
  toast('حظ النهارده: '+names[pick]);
  tm(function(){window[pick]()},900);
};
</script>
</body>
